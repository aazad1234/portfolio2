<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title-kvadrat desc-kvadrat">
  <title id="title-kvadrat">Kvadrat Quarterly Monograph Editorial Artwork</title>
  <desc id="desc-kvadrat">Modernist Swiss editorial publication layout and typographic grid in crisp white with emerald green accents.</desc>
  <defs>
    <filter id="kv-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="6" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#f8fafc"/>
  <rect x="2" y="2" width="1196" height="796" rx="4" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Open Editorial Spread Mockup (Two Pages Facing) -->
  <g transform="translate(140, 120)" filter="url(#kv-shadow)">
    <!-- Left Page in Pure White -->
    <rect x="0" y="0" width="460" height="560" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Page Header -->
    <text x="50" y="60" font-family="'Bricolage Grotesque', sans-serif" font-size="11" font-weight="700" fill="#D46743" letter-spacing="2">KVADRAT QUARTERLY / ISSUE 14</text>
    <text x="390" y="60" font-family="'Bricolage Grotesque', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">P. 48</text>
    <line x1="50" y1="75" x2="410" y2="75" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Large Typographic Editorial Heading -->
    <text x="50" y="140" font-family="'Bricolage Grotesque', sans-serif" font-size="38" font-weight="800" fill="#0f172a" letter-spacing="-1.5">Tactile Space</text>
    <text x="50" y="180" font-family="'Bricolage Grotesque', sans-serif" font-size="38" font-weight="800" fill="#D46743" letter-spacing="-1.5">&amp; Modernism</text>

    <!-- Two-column Typeset Body Simulation -->
    <g transform="translate(50, 220)">
      <!-- Left Column Lines -->
      <rect x="0" y="0" width="165" height="12" rx="2" fill="#0f172a" fill-opacity="0.85"/>
      <rect x="0" y="20" width="150" height="6" rx="1" fill="#64748b" fill-opacity="0.5"/>
      <rect x="0" y="32" width="160" height="6" rx="1" fill="#64748b" fill-opacity="0.5"/>
      <rect x="0" y="44" width="140" height="6" rx="1" fill="#64748b" fill-opacity="0.5"/>
      <rect x="0" y="56" width="165" height="6" rx="1" fill="#64748b" fill-opacity="0.5"/>
      <rect x="0" y="68" width="155" height="6" rx="1" fill="#64748b" fill-opacity="0.5"/>
      <!-- Pull Quote in Left Column -->
      <rect x="0" y="110" width="165" height="90" rx="4" fill="#FFF5EA" stroke="#FED7AA"/>
      <text x="15" y="140" font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="700" fill="#0f172a">"Form follows texture."</text>
      <text x="15" y="165" font-family="'Bricolage Grotesque', sans-serif" font-size="10" font-weight="600" fill="#D46743">— Dieter Rams Dialogue</text>
    </g>

    <g transform="translate(245, 220)">
      <!-- Right Column Lines -->
      <rect x="0" y="0" width="165" height="6" rx="1" fill="#64748b" fill-opacity="0.5"/>
      <rect x="0" y="12" width="155" height="6" rx="1" fill="#64748b" fill-opacity="0.5"/>
      <rect x="0" y="24" width="160" height="6" rx="1" fill="#64748b" fill-opacity="0.5"/>
      <rect x="0" y="36" width="145" height="6" rx="1" fill="#64748b" fill-opacity="0.5"/>
      <rect x="0" y="48" width="165" height="6" rx="1" fill="#64748b" fill-opacity="0.5"/>
      <rect x="0" y="75" width="165" height="130" rx="4" fill="#0f172a"/>
      <text x="82" y="145" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="12" font-weight="700" fill="#FDBA74">FIGURE 4.2</text>
      <text x="82" y="168" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="9" font-weight="500" fill="#ffffff">Woven Wool Study</text>
    </g>

    <!-- Right Page (Monograph Full-Bleed Artwork Page in Deep Forest Green) -->
    <rect x="460" y="0" width="460" height="560" rx="4" fill="#23150D"/>
    <!-- Central Architectural Graphic -->
    <circle cx="690" cy="240" r="140" fill="none" stroke="#D46743" stroke-width="2"/>
    <rect x="610" y="160" width="160" height="160" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="550" y1="240" x2="830" y2="240" stroke="#D46743" stroke-width="2"/>
    <line x1="690" y1="100" x2="690" y2="380" stroke="#D46743" stroke-width="2"/>
    <text x="690" y="450" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="4">KVADRAT</text>
    <text x="690" y="480" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="12" font-weight="600" fill="#FDBA74" letter-spacing="2">ARCHITECTURAL TEXTILES MONOGRAPH</text>
    <text x="860" y="530" font-family="'Bricolage Grotesque', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">P. 49</text>
  </g>
</svg>
