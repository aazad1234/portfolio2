<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Analytics Dashboard artwork</title>
  <desc id="desc">A dark dashboard interface with a line chart, bar chart, and donut chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#152143"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <clipPath id="chart-clip">
      <rect x="112" y="292" width="596" height="284" rx="18"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="990" cy="120" r="180" fill="#4338ca" opacity=".18" filter="url(#glow)"/>
  <circle cx="180" cy="710" r="160" fill="#0ea5e9" opacity=".12" filter="url(#glow)"/>
  <g opacity=".14" stroke="#93c5fd" stroke-width="1">
    <path d="M0 200h1200M0 320h1200M0 440h1200M0 560h1200M0 680h1200"/>
    <path d="M200 0v800M400 0v800M600 0v800M800 0v800M1000 0v800"/>
  </g>
  <rect x="80" y="62" width="1040" height="676" rx="28" fill="#0d1830" stroke="#25365c"/>
  <rect x="80" y="62" width="1040" height="66" rx="28" fill="#111e3a"/>
  <rect x="80" y="106" width="1040" height="22" fill="#111e3a"/>
  <circle cx="122" cy="95" r="7" fill="#f87171"/>
  <circle cx="146" cy="95" r="7" fill="#fbbf24"/>
  <circle cx="170" cy="95" r="7" fill="#34d399"/>
  <text x="206" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">Weekly overview</text>
  <rect x="930" y="81" width="126" height="30" rx="15" fill="#1b2b4f"/>
  <text x="993" y="101" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#bfdbfe">Last 7 days</text>
  <g>
    <rect x="112" y="164" width="228" height="104" rx="16" fill="#111e3a" stroke="#23345b"/>
    <text x="136" y="194" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#8ca3c9">Active sessions</text>
    <text x="136" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">24,892</text>
    <text x="136" y="253" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#34d399">+12.4% vs last week</text>
    <rect x="368" y="164" width="228" height="104" rx="16" fill="#111e3a" stroke="#23345b"/>
    <text x="392" y="194" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#8ca3c9">Conversion</text>
    <text x="392" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">4.72%</text>
    <text x="392" y="253" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#34d399">+0.8 points</text>
    <rect x="624" y="164" width="228" height="104" rx="16" fill="#111e3a" stroke="#23345b"/>
    <text x="648" y="194" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#8ca3c9">Avg. response</text>
    <text x="648" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">1.9s</text>
    <text x="648" y="253" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#fbbf24">Watch this</text>
    <rect x="880" y="164" width="208" height="104" rx="16" fill="#111e3a" stroke="#23345b"/>
    <text x="904" y="194" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#8ca3c9">Health</text>
    <circle cx="918" cy="232" r="20" fill="none" stroke="#1e3a5f" stroke-width="7"/>
    <circle cx="918" cy="232" r="20" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-dasharray="98 126" transform="rotate(-90 918 232)"/>
    <text x="954" y="229" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Good</text>
    <text x="954" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#8ca3c9">All systems normal</text>
  </g>
  <g>
    <rect x="112" y="292" width="596" height="284" rx="18" fill="#111e3a" stroke="#23345b"/>
    <text x="138" y="326" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Sessions over time</text>
    <text x="138" y="348" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7387aa">Daily unique visitors</text>
    <g stroke="#1c2c4d" stroke-width="1">
      <path d="M138 390h544M138 430h544M138 470h544M138 510h544"/>
    </g>
    <g clip-path="url(#chart-clip)">
      <path d="M138 516c40-20 64-24 98-48s58-16 98-40 58-16 100-34 56-10 98-6 70-4 110-6 26 2 40 2V576H138Z" fill="url(#area)"/>
      <path d="M138 516c40-20 64-24 98-48s58-16 98-40 58-16 100-34 56-10 98-6 70-4 110-6 26 2 40 2" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="682" cy="384" r="7" fill="#38bdf8" stroke="#0d1830" stroke-width="4"/>
    </g>
    <g font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7387aa">
      <text x="138" y="554">Mon</text>
      <text x="225" y="554">Tue</text>
      <text x="312" y="554">Wed</text>
      <text x="399" y="554">Thu</text>
      <text x="486" y="554">Fri</text>
      <text x="573" y="554">Sat</text>
      <text x="654" y="554">Sun</text>
    </g>
  </g>
  <g>
    <rect x="728" y="292" width="360" height="284" rx="18" fill="#111e3a" stroke="#23345b"/>
    <text x="754" y="326" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Channel mix</text>
    <g>
      <rect x="754" y="466" width="34" height="74" rx="8" fill="url(#bar)"/>
      <rect x="805" y="426" width="34" height="114" rx="8" fill="url(#bar)"/>
      <rect x="856" y="484" width="34" height="56" rx="8" fill="url(#bar)"/>
      <rect x="907" y="396" width="34" height="144" rx="8" fill="url(#bar)"/>
      <rect x="958" y="446" width="34" height="94" rx="8" fill="url(#bar)"/>
      <rect x="1009" y="412" width="34" height="128" rx="8" fill="url(#bar)"/>
    </g>
    <g font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7387aa">
      <text x="758" y="556">Direct</text>
      <text x="806" y="556">Search</text>
      <text x="861" y="556">Social</text>
      <text x="915" y="556">Email</text>
      <text x="966" y="556">Refer</text>
      <text x="1014" y="556">Other</text>
    </g>
  </g>
  <g>
    <rect x="112" y="600" width="976" height="100" rx="18" fill="#111e3a" stroke="#23345b"/>
    <g>
      <circle cx="160" cy="650" r="26" fill="none" stroke="#23345b" stroke-width="10"/>
      <circle cx="160" cy="650" r="26" fill="none" stroke="#38bdf8" stroke-width="10" stroke-dasharray="108 164" stroke-linecap="round" transform="rotate(-90 160 650)"/>
      <circle cx="160" cy="650" r="26" fill="none" stroke="#818cf8" stroke-width="10" stroke-dasharray="30 164" stroke-dashoffset="-108" stroke-linecap="round" transform="rotate(-90 160 650)"/>
    </g>
    <text x="206" y="638" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#8ca3c9">Traffic split</text>
    <text x="206" y="666" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#f8fafc">66% organic, 22% direct</text>
    <rect x="760" y="625" width="300" height="1" fill="#23345b" opacity="0"/>
    <text x="820" y="638" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7387aa">Updated just now</text>
    <text x="820" y="662" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#34d399">All sources connected</text>
    <circle cx="790" cy="652" r="6" fill="#34d399"/>
  </g>
</svg>
