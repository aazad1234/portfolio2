<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title-aura desc-aura">
  <title id="title-aura">Aura Botanicals Brand &amp; Packaging Artwork</title>
  <desc id="desc-aura">Minimalist botanical skincare packaging and visual identity in crisp white with emerald green accents.</desc>
  <defs>
    <linearGradient id="aura-bottle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D46743"/>
      <stop offset="100%" stop-color="#23150D"/>
    </linearGradient>
    <filter id="aura-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Crisp Light Canvas -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  <rect x="2" y="2" width="1196" height="796" rx="4" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Subtle Neutral Editorial Grid Lines -->
  <g stroke="#0f172a" stroke-opacity="0.04" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="800"/>
    <line x1="360" y1="0" x2="360" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="840" y1="0" x2="840" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Left: Brand Identity Board Card -->
  <g filter="url(#aura-shadow)">
    <rect x="140" y="150" width="440" height="500" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Card Header / Meta -->
    <rect x="180" y="195" width="140" height="26" rx="6" fill="#FFF5EA"/>
    <text x="250" y="213" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="11" font-weight="700" fill="#D46743" letter-spacing="1.5">BRAND SYSTEM 01</text>
    <text x="180" y="270" font-family="'Bricolage Grotesque', sans-serif" font-size="36" font-weight="800" fill="#0f172a" letter-spacing="-1">Aura Botanicals</text>
    <text x="180" y="302" font-family="'Bricolage Grotesque', sans-serif" font-size="15" font-weight="500" fill="#64748b">Organic Flora &amp; Botanical Serum</text>

    <!-- Botanical Logo Emblem -->
    <circle cx="360" cy="420" r="72" fill="#FFF5EA" stroke="#FED7AA" stroke-width="2"/>
    <path d="M360 370 C350 400 330 420 360 460 C390 420 370 400 360 370 Z" fill="#D46743"/>
    <circle cx="360" cy="420" r="14" fill="#FDBA74"/>

    <!-- Color Palette Swatches -->
    <g transform="translate(180, 545)">
      <rect x="0" y="0" width="65" height="38" rx="6" fill="#23150D"/>
      <rect x="75" y="0" width="65" height="38" rx="6" fill="#D46743"/>
      <rect x="150" y="0" width="65" height="38" rx="6" fill="#FDBA74"/>
      <rect x="225" y="0" width="65" height="38" rx="6" fill="#FFF5EA" stroke="#FED7AA"/>
      <rect x="300" y="0" width="65" height="38" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    </g>
  </g>

  <!-- Right: 3D Packaging Carton & Glass Dropper Bottle Mockup -->
  <g filter="url(#aura-shadow)">
    <!-- Secondary Box Carton in Crisp Deep Evergreen -->
    <rect x="640" y="140" width="220" height="520" rx="14" fill="#23150D" stroke="#B8502E" stroke-width="2"/>
    <!-- Crisp White Embossed Label on Box -->
    <rect x="670" y="220" width="160" height="260" rx="6" fill="#ffffff"/>
    <text x="750" y="270" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="11" font-weight="700" fill="#D46743" letter-spacing="2">ORGANIC FLORA</text>
    <circle cx="750" cy="320" r="24" fill="#FFF5EA"/>
    <path d="M750 305 C744 320 734 330 750 345 C766 330 756 320 750 305 Z" fill="#D46743"/>
    <text x="750" y="380" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="18" font-weight="800" fill="#0f172a">SERUM N°04</text>
    <text x="750" y="405" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="12" font-weight="500" fill="#64748b">50 ML / 1.7 FL. OZ.</text>
    <line x1="700" y1="430" x2="800" y2="430" stroke="#FED7AA" stroke-width="1"/>
    <text x="750" y="450" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="9" font-weight="700" fill="#D46743" letter-spacing="1">COLD PRESSED BOTANICALS</text>

    <!-- Glass Dropper Bottle Alongside -->
    <g transform="translate(890, 240)">
      <!-- Dropper Pipette Top -->
      <rect x="85" y="0" width="40" height="30" rx="4" fill="#0f172a"/>
      <rect x="75" y="25" width="60" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0"/>
      <!-- Bottle Glass Body -->
      <rect x="40" y="45" width="130" height="360" rx="28" fill="url(#aura-bottle)" stroke="#D46743" stroke-width="2"/>
      <!-- Bottle Label in Crisp White -->
      <rect x="58" y="160" width="94" height="180" rx="4" fill="#ffffff"/>
      <text x="105" y="200" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="9" font-weight="700" fill="#D46743" letter-spacing="1.5">AURA</text>
      <text x="105" y="235" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="15" font-weight="800" fill="#0f172a">N°04</text>
      <text x="105" y="260" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="10" font-weight="600" fill="#64748b">Night Elixir</text>
      <circle cx="105" cy="300" r="10" fill="#D46743"/>
    </g>
  </g>
</svg>
