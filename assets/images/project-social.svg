<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Common Ground artwork</title>
  <desc id="desc">Layered community feed cards with conversation bubbles and profile avatars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset=".55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="art1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="art2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1e1b4b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="240" fill="#db2777" opacity=".18"/>
  <circle cx="180" cy="700" r="220" fill="#0ea5e9" opacity=".15"/>
  <g opacity=".2" stroke="#e9d5ff" stroke-width="1">
    <circle cx="600" cy="400" r="330" fill="none"/>
    <circle cx="600" cy="400" r="420" fill="none"/>
    <circle cx="600" cy="400" r="510" fill="none"/>
  </g>
  <g transform="rotate(-6 380 420)" filter="url(#shadow)">
    <rect x="142" y="196" width="420" height="470" rx="28" fill="url(#panel)"/>
    <rect x="142" y="196" width="420" height="60" rx="28" fill="#f5f3ff"/>
    <rect x="142" y="236" width="420" height="20" fill="#f5f3ff"/>
    <text x="176" y="233" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#1e1b4b">Common Ground</text>
    <circle cx="518" cy="226" r="6" fill="#22c55e"/>
    <text x="176" y="296" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7c6fa4">THIS WEEK'S PROMPT</text>
    <text x="176" y="328" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1e1b4b">Show the messy middle.</text>
    <text x="176" y="352" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6b6480">Share one unfinished thing and what you learned.</text>
    <rect x="176" y="376" width="352" height="152" rx="18" fill="url(#art1)"/>
    <circle cx="250" cy="430" r="30" fill="#fdf2f8" opacity=".35"/>
    <path d="M200 506c50-74 92-44 136-92s88-26 156-54v118H200Z" fill="#fdf2f8" opacity=".28"/>
    <circle cx="490" cy="508" r="10" fill="#ffffff"/>
    <text x="470" y="512" text-anchor="end" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#ffffff">1 / 4</text>
    <g>
      <circle cx="196" cy="566" r="18" fill="#c4b5fd"/>
      <circle cx="204" cy="560" r="6" fill="#7c3aed" opacity=".35"/>
      <text x="226" y="562" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1e1b4b">Maya Lin</text>
      <text x="226" y="578" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7c6fa4">ceramics · 2h ago</text>
      <path d="M500 560c-10 0-18 7-18 16 0 9 8 16 18 16 3 0 6-1 8-2l12 5-3-13c3-3 4-7 4-11 0-9-8-16-18-16Z" fill="#ede9fe"/>
      <path d="M462 560c-10 0-18 7-18 16 0 4 2 8 5 11l-3 10 10-4c2 1 4 1 6 1 10 0 18-7 18-16s-8-18-18-18Z" fill="#ede9fe" opacity=".7"/>
    </g>
    <rect x="176" y="610" width="352" height="36" rx="18" fill="#f1eefb"/>
    <text x="196" y="633" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#8c82a6">Add a thoughtful reply...</text>
    <circle cx="500" cy="628" r="12" fill="url(#bubble)"/>
    <path d="M495 628h10M500 623v10" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g transform="rotate(5 830 390)" filter="url(#shadow)">
    <rect x="610" y="140" width="430" height="530" rx="28" fill="url(#panel)"/>
    <rect x="610" y="140" width="430" height="58" rx="28" fill="#eef2ff"/>
    <rect x="610" y="178" width="430" height="20" fill="#eef2ff"/>
    <text x="644" y="176" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1e1b4b">Small groups</text>
    <text x="1008" y="176" text-anchor="end" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#4f46e5">Explore all</text>
    <g>
      <rect x="642" y="226" width="366" height="100" rx="16" fill="#ffffff" stroke="#e0e7ff"/>
      <rect x="658" y="242" width="68" height="68" rx="12" fill="url(#art2)"/>
      <circle cx="692" cy="276" r="16" fill="#eff6ff" opacity=".5"/>
      <text x="742" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e1b4b">Analog photo club</text>
      <text x="742" y="286" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7c6fa4">128 members · weekly walk</text>
      <rect x="742" y="300" width="72" height="20" rx="10" fill="#eef2ff"/>
      <text x="778" y="314" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#4338ca">Join group</text>
    </g>
    <g>
      <rect x="642" y="340" width="366" height="100" rx="16" fill="#ffffff" stroke="#e0e7ff"/>
      <rect x="658" y="356" width="68" height="68" rx="12" fill="url(#art1)"/>
      <circle cx="692" cy="390" r="16" fill="#fdf2f8" opacity=".5"/>
      <text x="742" y="380" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e1b4b">Weekend builders</text>
      <text x="742" y="400" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7c6fa4">84 members · show and tell</text>
      <rect x="742" y="414" width="72" height="20" rx="10" fill="#eef2ff"/>
      <text x="778" y="428" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#4338ca">Join group</text>
    </g>
    <text x="642" y="484" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7c6fa4">RECENT ACTIVITY</text>
    <g>
      <circle cx="656" cy="516" r="13" fill="#c7d2fe"/>
      <text x="680" y="513" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#302b45">Noah replied to your project note.</text>
      <text x="680" y="529" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#8c82a6">12 minutes ago</text>
      <circle cx="656" cy="564" r="13" fill="#fbcfe8"/>
      <text x="680" y="561" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#302b45">Priya shared a new series.</text>
      <text x="680" y="577" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#8c82a6">1 hour ago</text>
      <circle cx="656" cy="612" r="13" fill="#a7f3d0"/>
      <text x="680" y="609" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#302b45">Your group prompt is live.</text>
      <text x="680" y="625" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#8c82a6">Today</text>
    </g>
  </g>
  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="264" y="92" width="222" height="56" rx="28" fill="#ffffff" opacity=".96"/>
    <circle cx="294" cy="120" r="9" fill="#22c55e"/>
    <text x="314" y="117" font-size="11" fill="#6b6480">Conversation</text>
    <text x="314" y="133" font-size="13" font-weight="600" fill="#1e1b4b">without the noise</text>
    <rect x="850" y="700" width="232" height="56" rx="28" fill="#ffffff" opacity=".96"/>
    <circle cx="882" cy="728" r="12" fill="#ede9fe"/>
    <path d="M877 728h10M882 723v10" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
    <text x="904" y="725" font-size="11" fill="#6b6480">Built around</text>
    <text x="904" y="741" font-size="13" font-weight="600" fill="#1e1b4b">small groups</text>
  </g>
</svg>
