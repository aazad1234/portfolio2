<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title-solstice desc-solstice">
  <title id="title-solstice">Solstice Arts Festival Poster and Visual Identity Artwork</title>
  <desc id="desc-solstice">Dynamic typographic poster and geometric festival visual identity in crisp white with emerald green accents.</desc>
  <defs>
    <filter id="sol-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Crisp Light Canvas -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  <rect x="2" y="2" width="1196" height="796" rx="4" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Left: A1 Exhibition Screenprint Poster Mockup -->
  <g transform="translate(160, 100)" filter="url(#sol-shadow)">
    <rect x="0" y="0" width="430" height="600" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Top Meta -->
    <text x="40" y="55" font-family="'Bricolage Grotesque', sans-serif" font-size="12" font-weight="800" fill="#0f172a" letter-spacing="3">SOLSTICE FESTIVAL 2026</text>
    <text x="330" y="55" font-family="'Bricolage Grotesque', sans-serif" font-size="11" font-weight="700" fill="#D46743">JUNE 21–24</text>
    <line x1="40" y1="70" x2="390" y2="70" stroke="#0f172a" stroke-width="2"/>

    <!-- Kinetic Geometric Forms in Green -->
    <circle cx="215" cy="220" r="105" fill="#D46743"/>
    <path d="M110 220 A105 105 0 0 1 320 220 Z" fill="#FDBA74"/>
    <rect x="175" y="180" width="80" height="80" rx="40" fill="#ffffff"/>
    <circle cx="215" cy="220" r="20" fill="#0f172a"/>

    <!-- Bold Typographic Poster Title -->
    <text x="40" y="380" font-family="'Bricolage Grotesque', sans-serif" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="-2">SOUND</text>
    <text x="40" y="430" font-family="'Bricolage Grotesque', sans-serif" font-size="52" font-weight="900" fill="#D46743" letter-spacing="-2">&amp; LIGHT</text>

    <text x="40" y="480" font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="600" fill="#475569">Electronic, Ambient &amp; Spatial Soundscapes</text>
    <text x="40" y="505" font-family="'Bricolage Grotesque', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Presidio Amphitheatre · San Francisco</text>

    <!-- Poster Barcode / Credits -->
    <g transform="translate(40, 535)">
      <rect x="0" y="0" width="4" height="24" fill="#0f172a"/>
      <rect x="8" y="0" width="2" height="24" fill="#0f172a"/>
      <rect x="14" y="0" width="6" height="24" fill="#0f172a"/>
      <rect x="24" y="0" width="3" height="24" fill="#0f172a"/>
      <rect x="31" y="0" width="5" height="24" fill="#0f172a"/>
      <rect x="40" y="0" width="2" height="24" fill="#0f172a"/>
      <rect x="46" y="0" width="7" height="24" fill="#0f172a"/>
      <text x="70" y="16" font-family="'Bricolage Grotesque', sans-serif" font-size="9" font-weight="700" fill="#0f172a" letter-spacing="1">ART DIRECTION: JOHN ANDERSON</text>
    </g>
  </g>

  <!-- Right: Identity System Application & Wayfinding Signage -->
  <g transform="translate(650, 120)" filter="url(#sol-shadow)">
    <!-- Festival Pass / VIP Badge in Crisp White & Green -->
    <rect x="0" y="0" width="230" height="360" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="70" rx="16" fill="#D46743"/>
    <rect x="90" y="15" width="50" height="8" rx="4" fill="#ffffff" fill-opacity="0.6"/>
    <text x="115" y="50" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="2">ALL ACCESS</text>

    <text x="115" y="115" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="22" font-weight="800" fill="#0f172a">SOLSTICE</text>
    <circle cx="115" cy="180" r="48" fill="#FFF5EA" stroke="#FED7AA" stroke-width="2"/>
    <text x="115" y="188" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="22" font-weight="900" fill="#D46743">VIP</text>

    <text x="115" y="270" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="700" fill="#0f172a">ALEXA VANDENBERG</text>
    <text x="115" y="292" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="10" font-weight="600" fill="#D46743">ARTIST / PERFORMER</text>
    <rect x="35" y="325" width="160" height="5" rx="2" fill="#D46743"/>

    <!-- Environmental Wayfinding Totem -->
    <g transform="translate(265, 40)">
      <rect x="0" y="0" width="160" height="460" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="0" y="0" width="160" height="85" rx="10" fill="#0f172a"/>
      <text x="80" y="45" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="16" font-weight="800" fill="#ffffff">STAGE 01</text>
      <text x="80" y="68" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-size="9" font-weight="600" fill="#FDBA74" letter-spacing="1">FOREST GLADE</text>
      <!-- Directional Arrows -->
      <text x="25" y="145" font-family="'Bricolage Grotesque', sans-serif" font-size="20" font-weight="800" fill="#D46743">→</text>
      <text x="60" y="142" font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="700" fill="#0f172a">Main Stage</text>
      <line x1="25" y1="175" x2="135" y2="175" stroke="#f1f5f9" stroke-width="1"/>
      <text x="25" y="225" font-family="'Bricolage Grotesque', sans-serif" font-size="20" font-weight="800" fill="#D46743">↑</text>
      <text x="60" y="222" font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="700" fill="#0f172a">Sound Dome</text>
      <line x1="25" y1="255" x2="135" y2="255" stroke="#f1f5f9" stroke-width="1"/>
      <text x="25" y="305" font-family="'Bricolage Grotesque', sans-serif" font-size="20" font-weight="800" fill="#D46743">←</text>
      <text x="60" y="302" font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="700" fill="#0f172a">Pavilion</text>
    </g>
  </g>
</svg>
